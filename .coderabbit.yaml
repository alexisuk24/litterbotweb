# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  profile: chill
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
  # Request changes for major findings; approve once they're resolved and the checks pass.
  auto_approvals:
    enabled: true
    min_blocking_severity: major
  # The PR rules workflow enforces the title format; these cover what a regex can't.
  pre_merge_checks:
    title:
      mode: warning
      requirements: |
        Conventional Commits ("<type>(<scope>): <summary>", see CONTRIBUTING.md). The summary
        is imperative ("add", not "added"), says what the change does rather than how, and
        matches what the diff actually changes.
    description:
      mode: warning
    custom_checks:
      - name: No secrets or personal data
        mode: error
        instructions: |
          Fail if the PR adds or modifies any of: a .env file (other than .env.example with
          placeholder values), credentials, tokens, API keys, real email addresses or passwords
          for a Whisker account, *.db or *.db-* files, .mp4 clips, pet photos, log files, or
          output of `lr_clips.py --dump` (raw Whisker API JSON). Otherwise pass.
      - name: Dependencies in sync
        mode: error
        instructions: |
          Python packages are installed in two places: the `pip install` in Dockerfile and the
          "Install dependencies" step in .github/workflows/tests.yml. Fail if the PR adds,
          removes or changes the version of a package in one of them but not the other. Pass if
          neither changes, or both change the same way.
      - name: Docs match behaviour
        mode: warning
        instructions: |
          Fail if the PR adds, renames or removes an environment variable (os.environ / getenv
          in the Python files) without the same change in README.md's env var table and
          compose.yml, or changes a setting, volume, port or user-visible behaviour that
          README.md describes without updating that description. Otherwise pass.
      - name: Tests for behaviour changes
        mode: warning
        instructions: |
          Fail if the PR changes behaviour in lr_*.py or web.py (not just comments, logging or
          formatting) without adding or updating a test in tests/ that covers it. Pass for
          docs-, CI- or test-only PRs.
  path_filters:
    - "!static/vendor/**"   # Chart.js, downloaded at build time
    - "!**/*.min.js"
  path_instructions:
    - path: "lr_auth.py"
      instructions: |
        Security-sensitive: Admin/Viewer roles from Cloudflare Access. Check that the
        Cf-Access-Jwt-Assertion is verified (signature, aud, iss, exp) before the email header is
        trusted, that Viewers can't reach anything that changes state, and that requests through
        Cloudflare without an identity are refused. Configuration must stay in environment variables.
    - path: "web.py"
      instructions: |
        Flask app. Every request passes _check_access (lr_auth) first; new routes that change
        state must not be reachable by Viewers. SQL must stay parameterized. File paths built from
        request input must be resolved and checked to stay under their root (see _clip_path,
        pet_photo). Anything sent to Whisker goes through the whisker_pushes queue and must respect
        the 7-day edit window and the write-back setting.
    - path: "lr_clips.py"
      instructions: |
        The collector: an asyncio loop. ffmpeg is run with argument lists, never a shell. Retention
        deletes and re-encodes clip files, so check that clips marked keep are never touched and
        that a failure leaves the original file in place.
    - path: "lr_db.py"
      instructions: |
        SQLite shared by the collector and the web UI. Migrations in _migrate run on every connect
        and must be idempotent. Writes should be short; long-held write transactions block the UI.
    - path: "static/**/*.js"
      instructions: &pages |
        Pages build HTML in template strings: every value from the API must go through esc() before
        it's inserted. templates/clips.html doesn't load static/common.js, so anything it uses must
        be defined on that page. Controls hidden from Viewers (CAN_EDIT) are only cosmetic; the
        server enforces roles.
    - path: "templates/**/*.html"
      instructions: *pages
    - path: "tests/**"
      instructions: |
        pytest. Each test gets its own empty database through the env fixture in conftest.py and
        must not touch Whisker, the network (except local test servers) or real data.
