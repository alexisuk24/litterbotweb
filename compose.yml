services:
  lr-clips:
    image: alexisuk24/litterbotweb:latest
    container_name: lr-clips
    restart: unless-stopped
    environment:
      LR_USERNAME: ${LR_USERNAME:?Set LR_USERNAME in .env or shell environment}
      LR_PASSWORD: ${LR_PASSWORD:?Set LR_PASSWORD in .env or shell environment}
      TZ: ${TZ:-UTC}
      LR_DOWNLOAD_INTERVAL: ${LR_DOWNLOAD_INTERVAL:-3600}
      LR_STATUS_INTERVAL: ${LR_STATUS_INTERVAL:-60}
      PYBOT_UPDATE_INTERVAL: ${PYBOT_UPDATE_INTERVAL:-86400}
      LR_ACTIVITY_MAX_PAGES: ${LR_ACTIVITY_MAX_PAGES:-50}
      LR_HWACCEL: ${LR_HWACCEL:-auto}
      # Access control with Cloudflare Access (see README): Admin or Viewer per user.
      LR_AUTH_HEADER: ${LR_AUTH_HEADER:-}            # e.g. Cf-Access-Authenticated-User-Email
      LR_AUTH_TEAM_DOMAIN: ${LR_AUTH_TEAM_DOMAIN:-}  # e.g. yourteam.cloudflareaccess.com
      LR_AUTH_AUD: ${LR_AUTH_AUD:-}                  # the Access application's Audience (AUD) tag
      LR_ADMINS: ${LR_ADMINS:-}                      # comma-separated admin emails
    # Hardware video encoding (Intel/AMD VAAPI) for clips that switch cameras:
    # uncomment both, with RENDER_GID set to the host's render group id
    # (getent group render | cut -d: -f3). Without them, encoding runs on the CPU.
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "${RENDER_GID:-109}"
    ports:
      - "2287:2287"
    volumes:
      - ${CLIPS_DIR:-./clips}:/clips
      - ${DATA_DIR:-./data}:/data
