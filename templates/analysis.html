<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Analysis · Litter Robot</title>
<link rel="stylesheet" href="{{ asset('app.css') }}">
{% include "_head.html" %}
<style>
.grid { display: grid; gap: 1rem; grid-template-columns: repeat(12, 1fr); }
.span-12 { grid-column: span 12; } .span-8 { grid-column: span 8; } .span-6 { grid-column: span 6; } .span-4 { grid-column: span 4; }
@media (max-width: 960px) { .span-8, .span-6, .span-4 { grid-column: span 12; } }
.panel { padding: 1rem 1.1rem; min-width: 0; }
.panel h2 { font-size: .95rem; font-weight: 600; }
.panel .sub { font-size: .78rem; color: var(--muted); margin-top: .15rem; }
.chart { position: relative; height: 260px; margin-top: .75rem; }
.chart.short { height: 180px; }

.insights { list-style: none; display: grid; gap: .5rem; margin-top: .75rem; }
.insights li { display: flex; gap: .6rem; align-items: flex-start; font-size: .88rem; line-height: 1.45; padding: .5rem .7rem; border-radius: 8px; background: var(--surface2); }
.insights li.warn { background: var(--warn-bg); }
.insights li .ic { flex-shrink: 0; width: 1.2rem; text-align: center; }
.insights li.warn .ic { color: var(--warn); }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1rem; }
.tile { padding: .9rem 1rem; }
.tile .k { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tile .v { font-size: 1.6rem; font-weight: 650; margin-top: .2rem; font-variant-numeric: tabular-nums; }
.tile .d { font-size: .78rem; color: var(--text2); margin-top: .1rem; }

.cats { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; }
.cat { padding: 1rem 1.1rem; border-top: 3px solid var(--c); }
.cat .name { display: flex; align-items: center; gap: .5rem; font-weight: 600; font-size: 1rem; }
.cat .name { gap: .65rem; }
.cat .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem 1rem; margin-top: .8rem; }
.cat .stat .k { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.cat .stat .v { font-size: 1.15rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.cat .stat .d { font-size: .75rem; color: var(--text2); font-variant-numeric: tabular-nums; }
.cat .stat .usual { color: var(--muted); }
.cat .stat .usual.off { color: var(--warn); }
.cat .usual-note { font-size: .75rem; margin-top: .35rem; }
.cat .report-btn { margin-left: auto; display: inline-flex; align-items: center; gap: .35rem; font-size: .78rem; font-weight: 500; padding: .3rem .6rem; }
.cat .report-btn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.confirm .dates { display: flex; gap: .75rem; flex-wrap: wrap; }
.confirm label { display: grid; gap: .25rem; font-size: .78rem; color: var(--muted); }
.confirm input[type=date] { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: .4rem .55rem; color-scheme: dark; }
.btn.go { background: var(--accent); border-color: var(--accent); color: #fff; }

.heat { margin-top: .75rem; overflow-x: auto; }
.heat table { border-collapse: separate; border-spacing: 2px; font-size: .68rem; color: var(--muted); }
.heat td { width: 26px; height: 22px; border-radius: 3px; }
.heat th { font-weight: 500; padding: 0 .3rem; text-align: right; }
.heat thead th { text-align: center; padding: 0 0 .2rem; }
.heat-legend { display: flex; align-items: center; gap: .4rem; font-size: .7rem; color: var(--muted); margin-top: .5rem; }
.heat-legend span.sw { width: 18px; height: 10px; border-radius: 2px; display: inline-block; }

table.mix { width: 100%; border-collapse: collapse; font-size: .85rem; margin-top: .75rem; }
table.mix td, table.mix th { padding: .4rem .3rem; border-bottom: 1px solid var(--border); text-align: left; }
table.mix th { font-size: .7rem; color: var(--muted); text-transform: uppercase; font-weight: 600; letter-spacing: .04em; }
table.mix td.n { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="page">
  <div class="toolbar">
    <div class="seg" id="range">
      <button data-v="7">7 days</button><button data-v="30">30 days</button><button data-v="90">90 days</button>
      <button data-v="365">1 year</button><button data-v="all">All</button>
    </div>
    <select id="robot" aria-label="Robot" hidden></select>
    <span class="muted" id="tzNote" style="font-size:.8rem;margin-left:auto"></span>
  </div>
  <div id="root"><div class="empty">Loading…</div></div>
</div>
<dialog class="confirm" id="report" aria-labelledby="reportTitle">
  <form method="dialog" id="reportForm">
    <h3 id="reportTitle">Vet report</h3>
    <p>A PDF for this cat: weight trend, visits per day, urine/stool split, anything outside the cat's usual range, and a day-by-day table.</p>
    <div class="dates">
      <label>From<input type="date" id="reportFrom" required></label>
      <label>To<input type="date" id="reportTo" required></label>
    </div>
    <div class="btns"><button class="btn" value="cancel" formnovalidate>Cancel</button><button class="btn go" value="ok">Download PDF</button></div>
  </form>
</dialog>
<script src="{{ asset('vendor/chart.umd.min.js') }}"></script>
<script src="{{ asset('common.js') }}"></script>
<script src="{{ asset('analysis.js') }}"></script>
<script src="{{ asset('sync.js') }}"></script>
</body>
</html>
