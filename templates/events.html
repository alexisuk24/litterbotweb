<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events · Litter Robot</title>
<link rel="stylesheet" href="/static/app.css">
<style>
.layout { display: grid; grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); gap: 1.25rem; align-items: start; }
.layout > * { min-width: 0; }
@media (max-width: 860px) {
  .page { padding-inline: .75rem; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .detail { position: static !important; order: -1; scroll-margin-top: 64px; }
  .detail.idle { display: none; }
  .ev { padding-inline: .75rem; }
}

.list { max-height: calc(100vh - 170px); overflow-y: auto; }
@media (max-width: 860px) { .list { max-height: none; } }
.day-head { position: sticky; top: 0; background: var(--surface); padding: .55rem 1rem; font-size: .7rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; z-index: 1; }
.ev { display: grid; grid-template-columns: 72px 1fr auto; gap: .75rem; align-items: center; padding: .55rem 1rem; cursor: pointer; border-left: 3px solid transparent; }
.ev:hover { background: var(--surface2); }
.ev.active { background: var(--surface2); border-left-color: var(--accent); }
.ev .thumb { width: 72px; height: 41px; border-radius: 6px; background: #000 center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .7rem; }
.ev .main { min-width: 0; }
.ev .row1 { display: flex; align-items: center; gap: .5rem; }
.ev .time { font-weight: 600; font-variant-numeric: tabular-nums; }
.ev .row2 { font-size: .78rem; color: var(--muted); margin-top: .2rem; display: flex; gap: .6rem; flex-wrap: wrap; font-variant-numeric: tabular-nums; }
.ev .side { display: flex; flex-direction: column; align-items: flex-end; gap: .25rem; }
.more { padding: .75rem; text-align: center; }

.detail { position: sticky; top: 72px; }
.detail video { width: 100%; aspect-ratio: 16/9; background: #000; display: block; border-radius: var(--r) var(--r) 0 0; }
.novideo { aspect-ratio: 16/9; display: flex; flex-direction: column; gap: .4rem; align-items: center; justify-content: center; color: var(--muted); background: #0a0b10; border-radius: var(--r) var(--r) 0 0; font-size: .875rem; text-align: center; padding: 1rem; }
.strip { display: flex; gap: .5rem; overflow-x: auto; padding: .6rem 1rem; border-bottom: 1px solid var(--border); }
.strip .c { flex: 0 0 auto; width: 112px; cursor: pointer; border-radius: 6px; border: 2px solid transparent; overflow: hidden; background: var(--surface2); }
.strip .c.on { border-color: var(--accent); }
.strip .c .img { height: 63px; background: #000 center/cover no-repeat; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .7rem; }
.strip .c .lbl { font-size: .7rem; padding: .2rem .35rem; display: flex; justify-content: space-between; color: var(--text2); font-variant-numeric: tabular-nums; }
.strip .c.far { opacity: .6; }
.strip .sep { align-self: center; font-size: .7rem; color: var(--muted); writing-mode: vertical-rl; transform: rotate(180deg); }

.keepbar { display: flex; align-items: center; gap: .75rem; padding: .6rem 1rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: .75rem 1rem; padding: 1rem; border-bottom: 1px solid var(--border); }
.fact .k { font-size: .7rem; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.fact .v { font-size: 1rem; font-weight: 600; margin-top: .15rem; font-variant-numeric: tabular-nums; }
.section { padding: 1rem; border-bottom: 1px solid var(--border); }
.section:last-child { border-bottom: 0; }
.section h3 { font-size: .8rem; font-weight: 600; color: var(--text2); margin-bottom: .6rem; display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; }
.pick { display: flex; flex-wrap: wrap; gap: .5rem; }
.pick button { display: flex; align-items: center; gap: .45rem; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; padding: .45rem .7rem; cursor: pointer; font-size: .875rem; text-align: left; }
.pick button:hover { border-color: var(--muted); }
.pick button.on { border-color: var(--text); box-shadow: 0 0 0 1px var(--text) inset; }
.pick button .sub { display: block; font-size: .7rem; color: var(--muted); }
.pick button kbd { margin-left: .2rem; }
.actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .75rem; align-items: center; }
.note { width: 100%; min-height: 54px; resize: vertical; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .5rem .6rem; font-size: .85rem; }
.hint { font-size: .78rem; color: var(--muted); margin-top: .5rem; line-height: 1.6; }
.callout { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: .5rem .7rem; font-size: .82rem; margin-bottom: .75rem; }
.nearby { font-size: .8rem; display: grid; gap: .25rem; }
.nearby div { display: flex; gap: .6rem; color: var(--text2); font-variant-numeric: tabular-nums; }
.nearby a { color: inherit; }
.push { font-size: .8rem; margin-top: .6rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.push.pending { color: var(--text2); }
.push.ok { color: var(--teal); }
.push.err { color: var(--warn); }
.saved { font-size: .75rem; color: var(--teal); opacity: 0; transition: opacity .3s; }
.saved.show { opacity: 1; }
</style>
</head>
<body>
{% include "_nav.html" %}
<div class="page">
  <div class="toolbar">
    <select id="fType" aria-label="Event type"></select>
    <select id="fPet" aria-label="Cat"></select>
    <div class="seg" id="fFilter">
      <button data-v="" class="on">All</button>
      <button data-v="review">Needs review</button>
      <button data-v="corrected">Edited</button>
    </div>
    <input type="date" id="fFrom" aria-label="From date">
    <input type="date" id="fTo" aria-label="To date">
    <select id="fRobot" aria-label="Robot" hidden></select>
    <span class="muted" id="count" style="font-size:.85rem;margin-left:auto"></span>
  </div>
  <div class="layout">
    <div class="card list" id="list"><div class="empty">Loading…</div></div>
    <div class="card detail idle" id="detail">
      <div class="empty"><div class="empty-icon">🐾</div><div>Select an event to see its clips</div>
        <div class="hint"><kbd>↑</kbd> <kbd>↓</kbd> move · <kbd>1</kbd>–<kbd>9</kbd> assign cat · <kbd>0</kbd> unknown · <kbd>u</kbd> undo edit</div>
      </div>
    </div>
  </div>
</div>
<script src="/static/common.js"></script>
<script src="/static/events.js"></script>
<script src="/static/sync.js"></script>
</body>
</html>
